<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Remote Desktop</title><link rel="stylesheet" href="style.css"></head>
<body>
<main>
  <div id="resize-warning" role="status" hidden></div>
  <header id="connection-header"><strong id="title">Remote Desktop</strong><span id="status" role="status" aria-live="polite">Loading…</span><div id="connection-actions" hidden><button id="ui-lock" class="icon-button" type="button" aria-label="Lock local input" aria-pressed="false" disabled><img class="action-icon" alt="" draggable="false" aria-hidden="true"></button><button id="clipboard" class="icon-button" type="button" aria-label="Enable clipboard" aria-pressed="false" disabled hidden><img class="action-icon" alt="" draggable="false" aria-hidden="true"></button><button id="download" class="icon-button" type="button" disabled hidden><img class="action-icon" alt="" draggable="false" aria-hidden="true"></button><button id="reset-input" class="icon-button" type="button" aria-label="Reset input" disabled><img class="action-icon" alt="" draggable="false" aria-hidden="true"></button><button id="input-text" class="icon-button" type="button" aria-label="Input text" disabled><img class="action-icon" alt="" draggable="false" aria-hidden="true"></button><button id="fit-window" class="icon-button" type="button" aria-label="Fit window to desktop" disabled hidden><img class="action-icon" alt="" draggable="false" aria-hidden="true"></button><button id="resolution-menu" class="icon-button" type="button" aria-label="Change resolution" aria-haspopup="menu" disabled hidden><img class="action-icon" alt="" draggable="false" aria-hidden="true"></button><button id="disconnect" class="icon-button" type="button" aria-label="Disconnect" hidden disabled><img class="action-icon" alt="" draggable="false" aria-hidden="true"></button><button id="move-window" class="icon-button" type="button" aria-label="Move to separate window" disabled hidden><img class="action-icon" alt="" draggable="false" aria-hidden="true"></button></div></header>
  <section id="surface">
  <section id="manager" hidden inert>
    <div id="toolbar" class="actions" role="group" aria-label="Server profiles"><button id="new" type="button" disabled>＋</button><button id="delete" type="button" disabled>−</button><button id="up" type="button" disabled>↑</button><button id="down" type="button" disabled>↓</button></div>
    <div id="sessions-error" role="status" hidden></div>
    <ul id="profiles" aria-label="Server profiles"></ul>
    <div id="empty" hidden><p id="empty-message"></p><button id="add-server" type="button">Add server</button></div>
    <section id="delete-confirm" role="alertdialog" aria-modal="false" aria-labelledby="delete-message" hidden><p id="delete-message"></p><div class="actions"><button id="confirm-delete" type="button">Delete</button><button id="cancel-delete" type="button">Cancel</button></div></section>
  </section>
  <form id="profile-editor" hidden inert>
    <p id="edit-locked" role="status" hidden></p>
    <div class="pair"><label><span data-label="name">Name</span><input id="name" maxlength="120" autocomplete="off"></label><label><span data-label="open-mode">Remote desktop opens in</span><select id="open-mode"><option value="sidebar" id="mode-sidebar">Sidebar</option><option value="window" id="mode-window">Window</option></select></label></div>
    <label><span data-label="resolution">Resolution</span><select id="resolution"><option value="1024x768">1024 × 768</option><option value="1280x800" selected>1280 × 800</option><option value="1600x900">1600 × 900</option><option value="1920x1080">1920 × 1080</option><option value="2560x1440">2560 × 1440</option><option value="custom" id="resolution-custom">Custom</option></select></label>
    <div id="custom-resolution" class="pair" hidden><label><span data-label="desktop-width">Width (px)</span><input id="desktop-width" type="number" value="1280" min="200" max="8192" step="2" required disabled></label><label><span data-label="desktop-height">Height (px)</span><input id="desktop-height" type="number" value="800" min="200" max="8192" step="1" required disabled></label></div>
    <div class="pair"><label class="check"><input id="adaptive-window" type="checkbox"><span data-label="adaptive-window">Adapt resolution in windows</span></label><label class="check"><input id="adaptive-sidebar" type="checkbox"><span data-label="adaptive-sidebar">Adapt resolution in sidebar</span></label></div>
    <div class="pair"><label class="check"><input id="clipboard-support" type="checkbox"><span data-label="clipboard-support">Support clipboard</span></label><label class="check"><input id="disable-mouse-animation" type="checkbox"><span data-label="disable-mouse-animation">Disable mouse animation</span></label></div>
    <div class="target"><label><span data-label="host">Address</span><input id="host" required autocomplete="off" spellcheck="false"></label><label><span data-label="port">Port</span><input id="port" type="number" value="3389" min="1" max="65535" required></label></div>
    <div class="pair"><label><span data-label="username">Username</span><input id="username" required autocomplete="off" spellcheck="false"></label><label><span data-label="domain">Domain (optional)</span><input id="domain" autocomplete="off" spellcheck="false"></label></div>
    <label><span data-label="password">Password</span><input id="password" type="password" autocomplete="off"></label>
    <label class="check"><input id="remember-password" type="checkbox"><span data-label="remember-password">Remember password (encrypted, included in backups)</span></label>
    <div class="actions"><button id="save" type="submit">Save</button><button id="cancel-edit" type="button" hidden>Cancel</button></div>
  </form>
  <form id="connection" hidden inert>
    <h1 id="connection-name" hidden></h1>
    <p id="connection-target"></p>
    <label id="session-password-field"><span id="session-password-label"></span><input id="session-password" type="password" autocomplete="off" maxlength="4096"></label>
    <label id="session-remember-field" class="check"><input id="session-remember-password" type="checkbox"><span data-label="session-remember-password">Remember password (encrypted, included in backups)</span></label>
    <div class="actions"><button id="connect" type="submit" disabled>Connect</button></div>
  </form>
  <section id="trust" hidden><p id="trust-message"></p><code id="fingerprint"></code><div class="actions"><button id="accept-certificate" type="button">Trust certificate and retry</button></div></section>
  <div id="download-status" hidden><span id="download-message" role="status"></span><progress id="download-progress" aria-labelledby="download-message"></progress><span id="download-error" role="alert"></span><div class="actions"><button id="download-cancel" type="button" hidden></button><button id="download-reveal" type="button" hidden></button><button id="download-dismiss" type="button" hidden></button></div></div>
  <div id="toolbar-error" role="alert" hidden></div>
  <div id="error" role="alert" hidden><span id="error-message"></span> <button id="reload-conflict" class="text-action" type="button" hidden>Reload</button></div>
  <button id="retry-profiles" type="button" hidden>Retry</button>
  <div id="language-warning" role="status" hidden></div>
  </section>
  <section id="desktop" aria-label="Remote desktop"></section>
</main>
<script src="/_anas/sdk.js"></script><script type="module" src="app.js"></script>
</body></html>
