name: Build release packages

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  web:
    name: Build shared Web and WASM
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '2'
      RDP_BUILD_COMPONENT: web
      RDP_PACKAGE_DIRECTORY: artifacts/components/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: node scripts/setup-build-tools.mjs
      - run: npm ci
      - run: npm run prepare:upstream
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .local/upstream/IronRDP/target
          key: rust-web-${{ hashFiles('upstream.lock.json') }}
      - run: npm run build:upstream
      - run: npm run typecheck
      - run: npm run test:ui
      - run: node --test test/profiles.test.mjs
      - run: npm run build
      - run: npm run package
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: component-web
          path: artifacts/anas-rdp-*-web.zip*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  native:
    name: Build native ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: win32-x64
            runner: windows-2022
            platform: win32
            arch: x64
          - name: darwin-arm64
            runner: macos-15
            platform: darwin
            arch: arm64
          - name: darwin-x64
            runner: macos-15-intel
            platform: darwin
            arch: x64
    env:
      CARGO_BUILD_JOBS: '2'
      RDP_BUILD_COMPONENT: native
      RDP_PACKAGE_DIRECTORY: artifacts/components/native
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          architecture: ${{ matrix.arch }}
      - name: Check version and native build host
        shell: node {0}
        env:
          EXPECTED_PLATFORM: ${{ matrix.platform }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          const assert = require('node:assert/strict');
          const { version } = require(`${process.env.GITHUB_WORKSPACE}/package.json`);
          assert.match(version, /^\d+\.\d+\.\d+$/);
          assert.equal(process.platform, process.env.EXPECTED_PLATFORM);
          assert.equal(process.arch, process.env.EXPECTED_ARCH);
          if (process.env.GITHUB_REF_TYPE === 'tag') assert.equal(process.env.GITHUB_REF_NAME, `v${version}`);
      - run: node scripts/setup-build-tools.mjs --native-only
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: rust-native-${{ matrix.name }}-${{ hashFiles('upstream.lock.json', 'native/Cargo.lock') }}
      - name: Check Rust formatting
        working-directory: native
        run: cargo fmt --check
      - name: Test native transport
        working-directory: native
        run: cargo test --locked
      - name: Check native code
        working-directory: native
        run: cargo clippy --locked --all-targets -- -D warnings
      - run: npm run build
      - run: npm run package
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: component-native-${{ matrix.name }}
          path: artifacts/anas-rdp-*-native-${{ matrix.name }}.zip*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  assemble:
    name: Assemble universal ZIP
    needs: [web, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: component-*
          path: artifacts
          merge-multiple: true
      - run: node scripts/assemble-universal.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: package-universal
          path: artifacts/anas-rdp-*-universal.zip*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  verify-universal:
    name: Verify universal on ${{ matrix.runner }}
    needs: assemble
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            arch: x64
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          architecture: ${{ matrix.arch }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: package-universal
          path: artifacts
      - run: npm run verify:package
        env:
          RDP_PACKAGE_VARIANT: universal

  publish:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: verify-universal
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: package-universal
          path: release-assets
      - name: Verify universal release and calculate checksum
        working-directory: release-assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          file="anas-rdp-${version}-universal.zip"
          test -s "$file"
          sha256sum --check --strict "$file.sha256"
          sha256sum "$file" > SHA256SUMS.txt
      - name: Publish universal ZIP and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          gh release create "$RELEASE_TAG" "release-assets/anas-rdp-${version}-universal.zip" release-assets/SHA256SUMS.txt \
            --verify-tag --title "Anas RDP $RELEASE_TAG" \
            --notes-file .github/RELEASE_NOTES.md --prerelease
